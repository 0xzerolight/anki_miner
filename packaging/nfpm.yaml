name: anki-miner
arch: amd64
platform: linux
version: "${VERSION}"
maintainer: "Anki Miner Contributors <noreply@github.com>"
description: "Japanese vocabulary mining from media with Anki integration"
vendor: "Anki Miner Contributors"
homepage: "https://github.com/0xzerolight/anki_miner"
license: "GPL-3.0-or-later"
section: "education"
priority: "optional"

overrides:
  deb:
    # The .deb ships the full AppImage tree (bundled ffmpeg, libmpv, and both
    # ASR backends) — see licenses/ffmpeg/README.md and licenses/libmpv/
    # README.md for the GPL source offers. No hard external deps remain.
    # libvulkan1 is the one soft dep: the bundled ggml-vulkan ASR backend
    # deliberately excludes the Vulkan loader (auditwheel --exclude), so GPU
    # transcription needs the system loader — without it, ASR still runs on
    # CPU. Recommends is installed by apt by default.
    recommends:
      - libvulkan1

contents:
  # Install the PyInstaller bundle to /opt/anki-miner/ — the SAME tree the
  # AppImage wraps (dist/AnkiMiner/), bundled ffmpeg/libmpv/ASR included. The
  # pre-v2.10 stripped deb-stage is gone: stripping could not reach the PYZ
  # inside the executable, so the app's find_spec probes saw the stripped
  # packages anyway and advertised ASR it could not deliver.
  - src: dist/AnkiMiner/
    dst: /opt/anki-miner/
    type: tree

  # Launcher shim, then PATH symlink pointing at IT rather than at the binary.
  # The shim prefers the host C++ runtime when it is newer than the bundled one:
  # the host Mesa driver is dlopened during GL bring-up and resolves libstdc++
  # from the bundle, and a mismatch there aborts the process. Same exposure as
  # the AppImage — same fix. See packaging/linux-launcher.sh.
  - src: packaging/linux-launcher.sh
    dst: /opt/anki-miner/anki-miner-launcher
    file_info:
      mode: 0755

  - src: /opt/anki-miner/anki-miner-launcher
    dst: /usr/bin/anki-miner
    type: symlink

  # Desktop entry
  - src: packaging/deb/anki-miner.desktop
    dst: /usr/share/applications/anki-miner.desktop
    file_info:
      mode: 0644

  # Application icon
  - src: anki_miner/gui/resources/icons/anki_miner.svg
    dst: /usr/share/icons/hicolor/scalable/apps/anki-miner.svg
    file_info:
      mode: 0644
