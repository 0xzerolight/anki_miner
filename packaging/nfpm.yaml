name: anki-miner
arch: amd64
platform: linux
version: "${VERSION}"
maintainer: "Anki Miner Contributors <noreply@github.com>"
description: "Japanese vocabulary mining from media with Anki integration"
vendor: "Anki Miner Contributors"
homepage: "https://github.com/0xzerolight/anki_miner"
license: "GPL-3.0-or-later"
section: "education"
priority: "optional"

overrides:
  deb:
    # The .deb does NOT bundle ffmpeg (see licenses/ffmpeg/README.md); it is a
    # hard runtime requirement satisfied by the system / PATH, so depends (not
    # recommends). The release workflow strips the bundled ffmpeg into the
    # deb-stage tree referenced below before packaging.
    depends:
      - ffmpeg
    # libmpv is a SOFT dep by design (unlike ffmpeg): without it the app runs
    # fully, only the in-app video preview degrades to a notice. Recommends is
    # installed by apt by default, so UX is unchanged; newer-first alternative
    # covers Debian 12/Ubuntu 24.04+ (libmpv2) and Ubuntu 22.04 (libmpv1) —
    # python-mpv's find_library('mpv') resolves either soname. The release
    # workflow strips the bundled libmpv from the deb-stage tree (fail-closed
    # verifier), same as ffmpeg; see licenses/libmpv/README.md.
    recommends:
      - libmpv2 | libmpv1

contents:
  # Install the PyInstaller bundle to /opt/anki-miner/. Source is dist/deb-stage/
  # — a copy of dist/AnkiMiner/ with the bundled GPL ffmpeg/ffprobe removed (the
  # deb relies on system ffmpeg). The AppImage still bundles ffmpeg.
  - src: dist/deb-stage/
    dst: /opt/anki-miner/
    type: tree

  # Symlink the executable into PATH
  - src: /opt/anki-miner/AnkiMiner
    dst: /usr/bin/anki-miner
    type: symlink

  # Desktop entry
  - src: packaging/deb/anki-miner.desktop
    dst: /usr/share/applications/anki-miner.desktop
    file_info:
      mode: 0644

  # Application icon
  - src: anki_miner/gui/resources/icons/anki_miner.svg
    dst: /usr/share/icons/hicolor/scalable/apps/anki-miner.svg
    file_info:
      mode: 0644
