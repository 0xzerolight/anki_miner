[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anki-miner"
dynamic = ["version"]
description = "Automated Japanese vocabulary mining from media with Anki integration"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    {name = "Anki Miner Contributors"}
]
keywords = ["anki", "japanese", "vocabulary", "anime", "subtitles", "language-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Utilities",
]

dependencies = [
    "pysubs2>=1.8.0",
    "requests>=2.34.0",
    "fugashi>=1.5.0",
    "unidic-lite>=1.0.8",
    "PyQt6>=6.10.0",
    "yt-dlp>=2026.3.17,<2027.0.0",
    "psutil>=7.0.0",
    "packaging>=25.0",
    "gtts>=2.5,<3",
]

[project.optional-dependencies]
asr = [
    "faster-whisper>=1.1.0",
]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=6.0.0",
    "pytest-qt>=4.4.0",
    "pytest-xdist>=3.6.0",
    # Backstop for the deadlock-prone worker tests: under parallel xdist a test
    # parked in event.wait()/QThread.wait() can hang the whole job until the
    # 20-min CI kill, with zero diagnostics. A per-test timeout fails fast and
    # names the offender (timeout_method below).
    "pytest-timeout>=2.3.0",
    "black>=26.3.1",
    "mypy>=1.15.0",
    "ruff>=0.9.0",
    "types-requests>=2.31.0",
    "pre-commit>=4.0.0",
    # Build-time only: scripts/build_name_wordsets.py parses JMnedict's
    # entity-laden XML (Issue #59). Not a runtime dependency.
    "lxml>=6.1.0",
    # Soft E2E dep: screenshot baseline-diff in tests/e2e/screenshot_diff.py.
    # PIL is never imported at runtime; the diff degrades gracefully if absent.
    "pillow>=10.0.0",
]
# Build-time only: pyside6-lrelease compiles .ts → .qm translation catalogs
# (scripts/i18n.py compile). NOT needed by tests or CI's drift check (which
# only extracts via pylupdate6). Kept OUT of `dev` so the test env stays
# single-binding — PySide6 alongside PyQt6 makes pytest-qt pick PySide6.
# Regenerate translations with: pip install -e ".[i18n]"
i18n = [
    "pyside6-essentials>=6.6.0",
]

[project.scripts]
anki_miner_gui = "anki_miner.gui.app:main"

[project.urls]
Homepage = "https://github.com/0xzerolight/anki_miner"
Documentation = "https://github.com/0xzerolight/anki_miner/blob/main/README.md"
"Bug Tracker" = "https://github.com/0xzerolight/anki_miner/issues"

[tool.setuptools]
include-package-data = true

# Ship the bundled dictionary card stylesheets (Issue #44 + card-style presets)
# and the JMnedict-derived name wordsets (Issue #59). They live outside
# gui/resources (which MANIFEST.in already covers), so declare them explicitly
# so pip/pipx wheels include them. The named preset stylesheets live in the
# `presets` subpackage, which the parent glob does NOT cover, so it gets its own
# entry. The PyInstaller bundle wires these via anki_miner.spec.
[tool.setuptools.package-data]
"anki_miner.services.dictionary.resources" = ["*.css"]
"anki_miner.services.dictionary.resources.presets" = ["*.css"]
"anki_miner.resources.wordsets" = ["*.txt"]
"anki_miner.gui.resources.translations" = ["*.ts", "*.qm"]

[tool.setuptools.dynamic]
version = {attr = "anki_miner.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["anki_miner*"]
exclude = ["tests*", "scripts*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Coverage is computed but never gated, so it's dropped from default runs
# (CI + local) to avoid paying for an ungated metric. Run it explicitly when
# needed: pytest --cov=anki_miner
# --max-worker-restart=0: a pytest-qt teardown segfault kills an xdist worker
# (`node down: Not properly terminated`). xdist's default is to restart the dead
# worker and limp on, then the controller wedges near end-of-run and the job hangs
# to the 20-min CI kill with no diagnostics. =0 makes the FIRST crash abort the
# session immediately and surface the crashing worker, instead of the silent hang.
# (pytest-timeout below cannot catch this — a segfault is dead before any timeout
# thread fires; it covers genuine deadlocks, a separate failure mode.)
addopts = "-n auto --dist loadfile --max-worker-restart=0 -m \"not e2e\""
# A hung test (worker parked on event.wait()/QThread.wait() under parallel xdist)
# otherwise blocks the whole job until the 20-min CI kill with no per-test info.
# 120s is vast headroom for sub-second unit tests; only a true deadlock trips it.
# `thread` (not `signal`) interrupts C-level blocking — Qt event loop, subprocess,
# QThread.wait() — and dumps every thread's stack on trip, naming the deadlock.
# e2e/soak tests that legitimately run longer override with @pytest.mark.timeout(0).
timeout = 120
timeout_method = "thread"
# The app is PyQt6-only. A stray PySide6 install (e.g. the i18n build dep)
# must not flip pytest-qt's binding auto-detection to PySide6, which would
# make qtbot reject every PyQt6 widget. Pin it.
qt_api = "pyqt6"
markers = [
    "youtube: requires network and yt-dlp real extractor",
    "real_ytdlp: exercises the real _ytdlp_supports_js_runtimes (no autouse stub)",
    "e2e: real-service end-to-end GUI tests (require running Anki; excluded by default)",
    "soak: multi-session soak tests",
    "asr: requires faster-whisper and a downloaded ASR model",
]

[tool.black]
line-length = 120
target-version = ["py311", "py312", "py313"]
include = '\.pyi?$'
extend-exclude = '''
/(
  | \.git
  | \.venv
  | venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["fugashi.*", "pysubs2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["faster_whisper.*", "ctranslate2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numpy.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = [
    "E501",   # Line length handled by black
    "N802",   # PyQt method overrides use camelCase (closeEvent, keyPressEvent, etc.)
    "N818",   # AnkiMinerException is the project's base exception name
    "UP035",  # Deprecated typing imports; most resolved by UP006/UP045 auto-fixes
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py

[tool.vulture]
# Deadcode scan config. Run bare `vulture` to pick these up.
paths = ["anki_miner"]
min_confidence = 80
# Qt virtual-method overrides are invoked by the C++ event loop, not by any
# Python caller vulture can see, so it reports them as unused. These names are
# always Qt overrides — listing them keeps real dead code visible while
# silencing the recurring false positives. Not a catch-all glob on purpose.
ignore_names = [
    "changeEvent",
    "closeEvent",
    "contextMenuEvent",
    "dragEnterEvent",
    "dragLeaveEvent",
    "dragMoveEvent",
    "dropEvent",
    "enterEvent",
    "eventFilter",
    "focusInEvent",
    "focusOutEvent",
    "hideEvent",
    "keyPressEvent",
    "keyReleaseEvent",
    "leaveEvent",
    "minimumSizeHint",
    "mouseDoubleClickEvent",
    "mouseMoveEvent",
    "mousePressEvent",
    "mouseReleaseEvent",
    "moveEvent",
    "paintEvent",
    "resizeEvent",
    "showEvent",
    "sizeHint",
    "wheelEvent",
]
