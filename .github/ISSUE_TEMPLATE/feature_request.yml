name: Feature request
description: Suggest a new feature or enhancement for Anki Miner.
title: "[Feature]: "
labels:
  - enhancement
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an idea. Before filing, please skim existing Issues and Discussions
        in case it has already been raised.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: One-line summary of the feature.
      placeholder: Add support for X.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What problem does this solve? What workflow would it enable or improve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like this to work? Sketches, UI ideas, API shape — all welcome.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why they don't fit as well.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, references, related projects, anything else.
    validations:
      required: false
