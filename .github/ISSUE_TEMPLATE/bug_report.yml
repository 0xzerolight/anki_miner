name: Bug report
description: Report a bug to help improve Anki Miner.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to file a bug report.
        Please fill in as much detail as you can — it makes the fix faster.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong? Include what you expected to happen and what actually happened.
      placeholder: When I do X, Y happens instead of Z.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps that reliably trigger the bug.
      placeholder: |
        1. Open Anki Miner.
        2. Load episode `…`.
        3. Click `Mine`.
        4. Observe error.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Anki Miner version
      description: Shown in Help → About. e.g. 2.5.0. Please make sure to update to the latest version to see if that fixes the bug. If Anki Miner will not open, use the version from the installer filename or the release page.
      placeholder: 2.5.0
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      description: e.g. Ubuntu 24.04, macOS 15.2, Windows 11.
    validations:
      required: true

  - type: dropdown
    id: install_method
    attributes:
      label: Install method
      description: How did you install Anki Miner?
      options:
        - pip
        - pipx
        - AppImage (Linux)
        - .deb (Linux)
        - Windows installer (.exe)
        - macOS bundle
        - Run from source
        - Other
    validations:
      required: true

  - type: upload
    id: log_files
    attributes:
      label: Anki Miner log files
      description: |
        Windows: `%USERPROFILE%\.anki_miner\anki_miner.log`. Rotated logs use `.1` through `.5`; ZIP the `anki_miner.log*` files. Use Help → Open Log Folder to find them. Review logs for private information before uploading. Help → Export Diagnostics… creates the ZIP in one step.
    validations:
      required: false
      accept: ".log,.txt,.zip"

  - type: dropdown
    id: log_status
    attributes:
      label: Log status
      description: What happened when you tried to collect the log files?
      options:
        - Attached above
        - No log file was created
        - Could not access the log folder
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / error output (optional paste alternative)
      description: If you cannot attach log files, paste any relevant log output or error messages. e.g. Paste Activity Log if bug is related to card processing.
      render: shell
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Subtitle format, video container, dictionary in use, anything else that may be relevant. More detail > less detail.
    validations:
      required: false
