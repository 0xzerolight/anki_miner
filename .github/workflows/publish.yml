name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

# Serialize per ref so a tag delete/re-push can't race two publish runs onto
# the same PyPI upload. Never cancel an in-flight publish (irreversible upload).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A v* tag does not trigger ci.yml (push/PR-to-main only), so neither publish
  # nor release is otherwise CI-validated. Require a green CI run on the exact
  # tagged commit before touching PyPI (publish is irreversible). Mirrored in
  # release.yml.
  ci-gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Require green CI on the tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Find completed ci.yml runs for this exact SHA and require one that
          # concluded "success". The tag must point at a merged commit whose CI
          # already ran on main; otherwise fail closed.
          RUNS=$(gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=completed" \
            --jq '[.workflow_runs[].conclusion]')
          echo "CI conclusions for ${GITHUB_SHA}: ${RUNS}"
          if echo "$RUNS" | grep -q '"success"'; then
            echo "Green CI run found for tagged commit."
          else
            echo "::error::No successful ci.yml run for ${GITHUB_SHA}. Tag a commit whose CI passed on main."
            exit 1
          fi

  build:
    needs: ci-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Validate tag matches package version
        shell: bash
        run: |
          TAG_VERSION=${GITHUB_REF_NAME#v}
          # Single source of truth: anki_miner/__init__.py (Issue #10). Parse the
          # literal directly so this step doesn't depend on the package being
          # installed. Mirrors release.yml's gate so a mis-tag can't republish a
          # stale __init__.py version (was masked by skip-existing).
          CODE_VERSION=$(python -c "import re; print(re.search(r'__version__\s*=\s*[\"\x27]([^\"\x27]+)[\"\x27]', open('anki_miner/__init__.py').read()).group(1))")
          echo "Tag version: $TAG_VERSION"
          echo "Code version: $CODE_VERSION"
          if [ "$TAG_VERSION" != "$CODE_VERSION" ]; then
            echo "::error::Version mismatch: git tag v$TAG_VERSION != anki_miner/__init__.py $CODE_VERSION"
            exit 1
          fi

      - name: Build package
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
