name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

# Serialize per ref so a tag delete/re-push can't race two publish runs onto
# the same PyPI upload. Never cancel an in-flight publish (irreversible upload).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A v* tag does not trigger ci.yml (push/PR-to-main only), so neither publish
  # nor release is otherwise CI-validated. Require a green CI run on the exact
  # tagged commit before touching PyPI (publish is irreversible). Mirrored in
  # release.yml.
  ci-gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Require green CI on the tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Wait for ci.yml on this SHA and require a "success" conclusion. The
          # tag is often pushed together with the commit, so the CI run may be
          # queued, in progress, or not yet registered when this gate starts
          # (v2.6.2 failed exactly that race). Still fail closed: no CI run
          # within the grace window, or CI finishing without success, fails.
          GRACE=300      # seconds for a CI run to appear at all
          DEADLINE=1800  # seconds total for CI to finish
          while :; do
            RUNS=$(gh api --paginate \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}" \
              --jq '[.workflow_runs[] | {status, conclusion}]')
            SUCCESS=$(echo "$RUNS" | jq '[.[] | select(.conclusion == "success")] | length')
            PENDING=$(echo "$RUNS" | jq '[.[] | select(.status != "completed")] | length')
            TOTAL=$(echo "$RUNS" | jq 'length')
            if [ "$SUCCESS" -gt 0 ]; then
              echo "Green CI run found for tagged commit."
              break
            fi
            if [ "$TOTAL" -gt 0 ] && [ "$PENDING" -eq 0 ]; then
              echo "::error::CI completed without success for ${GITHUB_SHA}. Fix CI, then re-tag."
              exit 1
            fi
            if [ "$TOTAL" -eq 0 ] && [ "$SECONDS" -ge "$GRACE" ]; then
              echo "::error::No ci.yml run appeared for ${GITHUB_SHA} within ${GRACE}s. Tag a commit pushed to main."
              exit 1
            fi
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "::error::Timed out waiting for CI on ${GITHUB_SHA}."
              exit 1
            fi
            echo "CI not complete yet (runs: ${TOTAL}, pending: ${PENDING}); retrying in 30s..."
            sleep 30
          done

  build:
    needs: ci-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Validate tag matches package version
        shell: bash
        run: |
          TAG_VERSION=${GITHUB_REF_NAME#v}
          # Single source of truth: anki_miner/__init__.py (Issue #10). Parse the
          # literal directly so this step doesn't depend on the package being
          # installed. Mirrors release.yml's gate so a mis-tag can't republish a
          # stale __init__.py version (was masked by skip-existing).
          CODE_VERSION=$(python -c "import re; print(re.search(r'__version__\s*=\s*[\"\x27]([^\"\x27]+)[\"\x27]', open('anki_miner/__init__.py').read()).group(1))")
          echo "Tag version: $TAG_VERSION"
          echo "Code version: $CODE_VERSION"
          if [ "$TAG_VERSION" != "$CODE_VERSION" ]; then
            echo "::error::Version mismatch: git tag v$TAG_VERSION != anki_miner/__init__.py $CODE_VERSION"
            exit 1
          fi

      - name: Build package
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
