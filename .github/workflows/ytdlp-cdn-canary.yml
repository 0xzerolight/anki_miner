name: yt-dlp CDN canary

# The yt-dlp updater validates the host a release download redirects to against an
# exact allowlist. When GitHub migrated release assets to
# release-assets.githubusercontent.com, that allowlist went stale and EVERY in-app
# yt-dlp install and update was refused, on every platform, for a month — while CI
# stayed green, because the unit fakes returned a hardcoded allowlisted host.
#
# This job is the tripwire for the next migration. It is deliberately NOT part of
# ci.yml: it needs the real network, so a GitHub or yt-dlp hiccup must not red an
# unrelated PR. Weekly is frequent enough — the failure mode is "downloads are
# broken until someone notices", and this makes someone notice.

on:
  schedule:
    # Mondays 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ytdlp-cdn-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    # Every leg is a bounded network read; without this a wedged connection would
    # sit on the 6h default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # pytest-qt imports QtGui in pytest_configure and conftest's autouse fixtures
      # import PyQt6 around every test, so pytest cannot start in this repo without
      # these — whatever tests are selected. Omitting them is what made this canary
      # die with `ImportError: libEGL.so.1` before collection and file a "CDN host
      # drifted" issue having tested nothing (issue #104). Keep in sync with ci.yml;
      # tests/unit/test_workflow_qt_deps.py enforces it.
      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libpulse0 libxkbcommon0

      - name: Install (no extras needed for the canary)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Resolve the real release redirect
        id: canary
        env:
          # Raises the unauthenticated 60-req/hour api.github.com limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          pytest -m "youtube and network" \
            tests/integration/test_ytdlp_release_cdn_canary.py \
            -p no:randomly -n0 -q 2>&1 | tee canary.log
          # A skipped leg means the CDN was never actually checked, and pytest still
          # exits 0 — a green canary that verified nothing. The API leg alone cannot
          # catch drift (api.github.com does not redirect, so its assertion is a
          # tautology), so treat any skip as degraded rather than tolerable.
          #
          # `if`-form, not `grep ... && { ...; }`: this is the last statement in the
          # step, so an && list that misses returns grep's 1 and would red every
          # healthy run. set -e is not the mechanism — it exempts the left side of an
          # && list. Do not "fix" this with `|| true` or by moving the grep; both
          # silently disarm the check.
          if grep -q "skipped" canary.log; then
            echo "canary degraded: a leg skipped, so the CDN was not actually checked"
            exit 1
          fi

      # Reports THAT the canary failed and pastes the evidence; it does not claim to
      # know why. The previous version fired on bare `if: failure()` with a body
      # asserting CDN drift, so a pytest INTERNALERROR filed a confident, wrong
      # allowlist bug report (issue #104).
      #
      # `if: failure()` stays at step level on purpose — it also covers a failed
      # checkout or pip install, which a pytest-outcome-only gate would drop on the
      # floor. The schedule check lives INSIDE the script instead: a YAML-level
      # `github.event_name == 'schedule'` gate would make this script unreachable
      # from a workflow_dispatch, i.e. unrunnable before it matters, which is the
      # same "never executed until the real failure" defect that produced #104. As
      # written, a dispatch exercises the log read, the body template and the dedup
      # query, and performs no writes.
      - name: Report the canary failure
        if: failure()
        # Byte-identical to what @v7 resolved to, so this pin changes no behaviour
        # alongside the script rewrite. Deliberately not v9: that commit is
        # "feat!: add getOctokit to script context, upgrade @actions/github v9,
        # @octokit/core v7" — two breaking majors landing in the one step this change
        # rewrites. Let dependabot carry the major as its own reviewable PR.
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            const dryRun = context.eventName !== 'schedule';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            let tail = '(no canary.log — the run failed before pytest started)';
            try {
              tail = fs.readFileSync('canary.log', 'utf8').trimEnd().split('\n').slice(-40).join('\n');
            } catch (error) {
              core.info(`could not read canary.log: ${error.message}`);
            }

            const title = 'yt-dlp CDN canary failed';
            const body = [
              `The yt-dlp CDN canary failed: ${runUrl}`,
              '',
              'Read the log tail below before changing anything — this issue does not',
              'know the cause, and the two cases need opposite fixes:',
              '',
              '- **`drifted off the allowlist` assertion** → a release download now lands on',
              '  a host outside `_GITHUB_URL_ALLOWLIST`, so every in-app yt-dlp install and',
              '  update is refused for every user. Add the exact new host to the allowlist in',
              '  BOTH `anki_miner/services/ytdlp_updater.py` and',
              '  `anki_miner/services/update_checker.py`. Do **not** widen it to a',
              '  `*.githubusercontent.com` suffix match — `raw.` and `gist.` serve arbitrary',
              '  user-authored bytes, and the `SHA2-256SUMS` fetch is guarded by this',
              '  allowlist alone, so the hash cannot backstop a widened set.',
              '- **anything else** (INTERNALERROR, install failure, skipped legs) → the canary',
              '  itself is broken and the CDN is probably fine. Fix the canary; do not touch',
              '  the allowlist on this evidence.',
              '',
              '<details><summary>canary.log (last 40 lines)</summary>',
              '',
              '```',
              tail,
              '```',
              '',
              '</details>',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ytdlp-cdn',
            });

            if (dryRun) {
              core.info(`DRY RUN (event: ${context.eventName}) — would post:\n${body}`);
              return;
            }

            // Comment rather than return: a stale open issue used to make this step
            // swallow every later report, so one wrong issue could mask a real drift
            // indefinitely.
            if (existing.data.length > 0) {
              const number = existing.data[0].number;
              core.info(`Issue #${number} already open; commenting instead of filing a duplicate.`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                body,
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['ytdlp-cdn', 'bug'],
            });
