name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: black --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: mypy anki_miner

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libpulse0 libxkbcommon0
      - run: pip install -e ".[dev]"
      - run: pytest -m "not youtube" --cov=anki_miner --cov-report=term-missing
        env:
          QT_QPA_PLATFORM: offscreen

  smoke-min-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libpulse0 libxkbcommon0
      - name: Install with floor versions of fragile deps
        run: |
          pip install -e ".[dev]"
          pip install "yt-dlp==2026.3.3" "psutil==5.9.0"
      - name: Smoke-test YouTube layer at floor versions
        run: pytest tests/unit/test_youtube_fetcher.py tests/unit/test_youtube_workspace_cleanup.py -m "not youtube" -q
        env:
          QT_QPA_PLATFORM: offscreen

  wheel-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade build
      - run: python -m build --wheel
      - run: python scripts/check_wheel_assets.py
