name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual re-trigger. release.yml and publish.yml both refuse to act until a
  # ci.yml run exists for the exact tagged SHA, and a push event that GitHub
  # drops (an Actions incident shedding inbound traffic, 2026-08-26) cannot be
  # redelivered -- leaving an empty commit as the only way to attach CI to a
  # commit. Dispatch runs against the ref's current HEAD, so the ref being
  # tagged can be attested without changing it.
  workflow_dispatch:

# Cancel superseded CI runs on the same ref (a new push to a PR obsoletes the
# prior run). Safe to cancel: CI has no irreversible side effects.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: black --check .

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: mypy anki_miner

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One red interpreter must not cancel the other two: the default
      # fail-fast reported "failure / cancelled / cancelled", which reads as a
      # version-specific break even when all three fail identically.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libpulse0 libxkbcommon0
      - run: pip install -e ".[dev,languages]"
      # spaCy models are GitHub release assets, not PyPI packages, so no extra
      # can name them, and the real-model language tests hard-require them.
      # Same bytes as each languages/<code>/pack.py manifest
      # (tests/unit/languages/test_spacy_model_ci_pins.py). Not in test-asr: its
      # marker selects no language test.
      - run: >-
          pip install
          "ca_core_news_sm @ https://github.com/explosion/spacy-models/releases/download/ca_core_news_sm-3.8.0/ca_core_news_sm-3.8.0-py3-none-any.whl#sha256=e214211aa8da91c24ebdc453c2aa5f54fac09f44e01e65bcbdd3b0a5cb94d809"
          "de_core_news_sm @ https://github.com/explosion/spacy-models/releases/download/de_core_news_sm-3.8.0/de_core_news_sm-3.8.0-py3-none-any.whl#sha256=fec69fec52b1780f2d269d5af7582a5e28028738bd3190532459aeb473bfa3e7"
          "el_core_news_sm @ https://github.com/explosion/spacy-models/releases/download/el_core_news_sm-3.8.0/el_core_news_sm-3.8.0-py3-none-any.whl#sha256=18df59b7f099a20d6f7cc1f964a57408a4c1663b73b5110932c1ea24f66e3027"
          "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl#sha256=1932429db727d4bff3deed6b34cfc05df17794f4a52eeb26cf8928f7c1a0fb85"
          "es_core_news_sm @ https://github.com/explosion/spacy-models/releases/download/es_core_news_sm-3.8.0/es_core_news_sm-3.8.0-py3-none-any.whl#sha256=e451a83d6df79b87e9eed0cb553f03e99e36a3bab18a7b79f0dcfd1fdf875e12"
          "fi_core_news_sm @ https://github.com/explosion/spacy-models/releases/download/fi_core_news_sm-3.8.0/fi_core_news_sm-3.8.0-py3-none-any.whl#sha256=5b9bd1496f500c1fac98f5e6a5d3913aa502f188c094ecea191dc6b8a81f418d"
          "fr_core_news_sm @ https://github.com/explosion/spacy-models/releases/download/fr_core_news_sm-3.8.0/fr_core_news_sm-3.8.0-py3-none-any.whl#sha256=7d6ad14cd5078e53147bfbf70fb9d433c6a3865b695fda2657140bbc59a27e29"
          "hr_core_news_sm @ https://github.com/explosion/spacy-models/releases/download/hr_core_news_sm-3.8.0/hr_core_news_sm-3.8.0-py3-none-any.whl#sha256=393ad455bba13536e6fb257bce2b5ef0253f41c1fb5249d8c16dde6cf116d196"
          "it_core_news_sm @ https://github.com/explosion/spacy-models/releases/download/it_core_news_sm-3.8.0/it_core_news_sm-3.8.0-py3-none-any.whl#sha256=3f617bf9a8ae0418953cf1fbf014e10272684c4229e882a7fd748b637d0100bf"
          "nb_core_news_sm @ https://github.com/explosion/spacy-models/releases/download/nb_core_news_sm-3.8.0/nb_core_news_sm-3.8.0-py3-none-any.whl#sha256=086f2cfcc1568b2ee49a2ab297f7910f2645ae6892f2d5d15d8b077f5d0bd773"
          "nl_core_news_sm @ https://github.com/explosion/spacy-models/releases/download/nl_core_news_sm-3.8.0/nl_core_news_sm-3.8.0-py3-none-any.whl#sha256=a76978477821f213ca76a46c686df1b1d41462905d4868bc53eac086adca8b7e"
          "pt_core_news_sm @ https://github.com/explosion/spacy-models/releases/download/pt_core_news_sm-3.8.0/pt_core_news_sm-3.8.0-py3-none-any.whl#sha256=c304fa04db3af73cd08a250feacf560506e15a2ec2469bd1b09f06847f6b455c"
          "ro_core_news_sm @ https://github.com/explosion/spacy-models/releases/download/ro_core_news_sm-3.8.0/ro_core_news_sm-3.8.0-py3-none-any.whl#sha256=3cebfba2437131efe95345adcc7ea2131e4463915652df9099c577e618460cd9"
      # hu_core_news_md is a HuggingFace asset named hu_core_news_md-any-py3-none-any.whl;
      # `any` is no version, so pip refuses it as a URL requirement. Download it, check the
      # sha256 languages/hu/pack.py pins (test_spacy_model_ci_pins.py), and install it under
      # a valid wheel name.
      - run: |
          curl -fsSL -o "$RUNNER_TEMP/hu_core_news_md-3.8.0-py3-none-any.whl" https://huggingface.co/huspacy/hu_core_news_md/resolve/v3.8.0/hu_core_news_md-any-py3-none-any.whl
          echo "0fd89c6ccf0efe1d7591910065c3bec4eadb1e25313d6ceea551150832b0f861  $RUNNER_TEMP/hu_core_news_md-3.8.0-py3-none-any.whl" | sha256sum -c -
          pip install "$RUNNER_TEMP/hu_core_news_md-3.8.0-py3-none-any.whl"
      # `golden` = the Android-port engine parity contract; it's a separate
      # project's concern, and every case clones the pinned revision and runs a
      # real export. It has no hosted derivation workflow at all — the anki-miner
      # repo's exporter is driven manually from anki-miner-android, which commits
      # and verifies the reviewed contract. Excluding it is also why this checkout
      # no longer needs fetch-depth: 0.
      - run: pytest -m "not youtube and not e2e and not asr and not golden"
        env:
          QT_QPA_PLATFORM: offscreen
          # Declared, not inherited. Qt derives QLocale() from LANG, and its C
          # locale sets OmitGroupSeparator -- so a number the app renders as
          # "184,200" on a developer's en_US box comes out "184200" here. Pin it
          # so the runner image cannot change that under us.
          LANG: C.UTF-8

  wheel-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --upgrade build
      - run: python -m build --wheel
      - run: python scripts/check_wheel_assets.py

  test-asr:
    # Installs the [asr] extra (faster-whisper + ctranslate2) and runs only the
    # tests marked with @pytest.mark.asr.  The default lint/typecheck/test jobs
    # keep .[dev] (no faster-whisper) so Task 2's import-seam + mypy overrides
    # stay green there.  faster-whisper has binary wheels for Linux x86-64 on
    # PyPI, so ubuntu-latest is the right runner.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libpulse0 libxkbcommon0
      - run: pip install -e ".[dev,asr,asr-vulkan]"
      - run: pytest -m "asr and not e2e"
        env:
          QT_QPA_PLATFORM: offscreen
