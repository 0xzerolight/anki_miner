name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded CI runs on the same ref (a new push to a PR obsoletes the
# prior run). Safe to cancel: CI has no irreversible side effects.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: black --check .

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: mypy anki_miner

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Golden-exporter tests clone this checkout and exercise the pinned
          # Android engine revision, so its commit must exist locally.
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libpulse0 libxkbcommon0
      - run: pip install -e ".[dev]"
      - run: pytest -m "not youtube and not e2e and not asr"
        env:
          QT_QPA_PLATFORM: offscreen

  wheel-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: pip install --upgrade build
      - run: python -m build --wheel
      - run: python scripts/check_wheel_assets.py

  test-asr:
    # Installs the [asr] extra (faster-whisper + ctranslate2) and runs only the
    # tests marked with @pytest.mark.asr.  The default lint/typecheck/test jobs
    # keep .[dev] (no faster-whisper) so Task 2's import-seam + mypy overrides
    # stay green there.  faster-whisper has binary wheels for Linux x86-64 on
    # PyPI, so ubuntu-latest is the right runner.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libpulse0 libxkbcommon0
      - run: pip install -e ".[dev,asr,asr-vulkan]"
      - run: pytest -m "asr and not e2e"
        env:
          QT_QPA_PLATFORM: offscreen
