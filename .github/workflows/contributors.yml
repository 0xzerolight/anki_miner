name: Update CONTRIBUTORS.md

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened]
  discussion:
    types: [created]
  discussion_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read
  discussions: read

concurrency:
  group: update-contributors
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20"

      - name: Regenerate CONTRIBUTORS.md
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/update_contributors.mjs

      - name: Commit if changed
        env:
          NEW_LOGINS: ${{ steps.update.outputs.new_logins }}
        run: |
          if git diff --quiet CONTRIBUTORS.md; then
            echo "No changes to CONTRIBUTORS.md."
            exit 0
          fi

          # Build a personal commit message when new logins appeared this run.
          # Cap at 3 mentions to keep the subject line short; overflow becomes
          # "and N more". Plain message when only avatar/order changes happened.
          if [ -n "$NEW_LOGINS" ]; then
            IFS=',' read -ra logins <<< "$NEW_LOGINS"
            count=${#logins[@]}
            mentions=""
            for i in 0 1 2; do
              [ $i -ge $count ] && break
              [ -n "$mentions" ] && mentions+=", "
              mentions+="@${logins[$i]}"
            done
            if [ $count -gt 3 ]; then
              mentions+=" and $((count - 3)) more"
            fi
            msg="chore: welcome ${mentions} to CONTRIBUTORS.md [skip ci]"
          else
            msg='chore: refresh CONTRIBUTORS.md [skip ci]'
          fi

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CONTRIBUTORS.md
          git commit -m "$msg"
          git push
