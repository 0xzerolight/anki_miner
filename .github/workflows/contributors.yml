name: Update CONTRIBUTORS.md

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened]
  discussion:
    types: [created]
  discussion_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read
  discussions: read

concurrency:
  group: update-contributors
  cancel-in-progress: true

jobs:
  update:
    # Dependabot is never listed in CONTRIBUTORS.md, so regenerating for its PRs
    # is pure churn -- and because the concurrency group above is deliberately
    # global (one shared file, serialized on purpose), a burst of dependabot PRs
    # makes these runs cancel each other and report as failed checks.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "20"

      - name: Regenerate CONTRIBUTORS.md
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/update_contributors.mjs

      - name: Commit if changed
        env:
          NEW_LOGINS: ${{ steps.update.outputs.new_logins }}
        run: |
          if git diff --quiet CONTRIBUTORS.md; then
            echo "No changes to CONTRIBUTORS.md."
            exit 0
          fi

          # Build a personal commit message when new logins appeared this run.
          # Cap at 3 mentions to keep the subject line short; overflow becomes
          # "and N more". Plain message when only avatar/order changes happened.
          #
          # No "[skip ci]" marker: main's ruleset requires 7 status checks, and
          # skipping CI means they never report, so every push was refused with
          # "GH013 ... 7 of 7 required status checks are expected". One extra CI
          # run per new contributor is the cheaper side of that trade.
          if [ -n "$NEW_LOGINS" ]; then
            IFS=',' read -ra logins <<< "$NEW_LOGINS"
            count=${#logins[@]}
            mentions=""
            for i in 0 1 2; do
              [ $i -ge $count ] && break
              [ -n "$mentions" ] && mentions+=", "
              mentions+="@${logins[$i]}"
            done
            if [ $count -gt 3 ]; then
              mentions+=" and $((count - 3)) more"
            fi
            msg="chore: welcome ${mentions} to CONTRIBUTORS.md"
          else
            msg='chore: refresh CONTRIBUTORS.md'
          fi

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CONTRIBUTORS.md
          git commit -m "$msg"
          git push
