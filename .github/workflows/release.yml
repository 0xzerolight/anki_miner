name: Build Executables

on:
  push:
    tags:
      - "v*"
# Uncomment to enable manual triggering for testing:
# workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact_name: AnkiMiner-Linux-x86_64
          - os: windows-latest
            artifact_name: AnkiMiner-Windows-x86_64
          - os: macos-latest
            artifact_name: AnkiMiner-macOS-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-xinerama0 libxkbcommon-x11-0 libegl1

      - name: Install dependencies
        run: |
          pip install .
          pip install pyinstaller

      - name: Extract and validate version
        id: version
        shell: bash
        run: |
          TAG_VERSION=${GITHUB_REF_NAME#v}
          CODE_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "Tag version: $TAG_VERSION"
          echo "Code version: $CODE_VERSION"
          if [ "$TAG_VERSION" != "$CODE_VERSION" ]; then
            echo "::error::Version mismatch: git tag v$TAG_VERSION != pyproject.toml $CODE_VERSION"
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build with PyInstaller
        run: pyinstaller --additional-hooks-dir=PyInstaller-Hooks anki_miner.spec

      - name: YouTube bundled smoke (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          ANKI_MINER_SMOKE: youtube
          QT_QPA_PLATFORM: offscreen
        continue-on-error: true
        run: |
          ./dist/AnkiMiner/AnkiMiner 2>&1 | tee smoke.log
          grep -q "BUNDLED_SMOKE_PASS" smoke.log

      - name: YouTube bundled smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ANKI_MINER_SMOKE: youtube
          QT_QPA_PLATFORM: offscreen
        continue-on-error: true
        run: |
          .\dist\AnkiMiner\AnkiMiner.exe 2>&1 | Tee-Object -FilePath smoke.log
          if (-not (Select-String -Path smoke.log -Pattern "BUNDLED_SMOKE_PASS" -Quiet)) {
            Write-Error "BUNDLED_SMOKE_PASS not found"
            exit 1
          }

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: iscc /DAppVersion=${{ steps.version.outputs.version }} packaging\innosetup\anki_miner.iss

      - name: Build AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x packaging/appimage/build-appimage.sh
          packaging/appimage/build-appimage.sh ${{ steps.version.outputs.version }}

      - name: Install nfpm (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -q https://github.com/goreleaser/nfpm/releases/download/v2.46.0/nfpm_2.46.0_Linux_x86_64.tar.gz
          tar -xzf nfpm_2.46.0_Linux_x86_64.tar.gz nfpm
          chmod +x nfpm

      - name: Build .deb package (Linux)
        if: runner.os == 'Linux'
        run: |
          VERSION=${{ steps.version.outputs.version }} ./nfpm package \
            --config packaging/nfpm.yaml \
            --packager deb \
            --target dist/anki-miner_${{ steps.version.outputs.version }}_amd64.deb

      - name: Create archive (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd dist
          tar -czf ${{ matrix.artifact_name }}.tar.gz AnkiMiner/

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\AnkiMiner\* -DestinationPath dist\${{ matrix.artifact_name }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/${{ matrix.artifact_name }}.tar.gz
            dist/${{ matrix.artifact_name }}.zip
            dist/AnkiMiner-*-Setup.exe
            dist/AnkiMiner-*.AppImage
            dist/anki-miner_*.deb

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*-Setup.exe
            artifacts/**/*.AppImage
            artifacts/**/*.deb
