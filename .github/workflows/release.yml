name: Build Executables

on:
  push:
    tags:
      - "v*"
  # Manual dispatch = release DRY-RUN. Builds the full matrix + bundle smokes but
  # NEVER creates a tag, GitHub Release, or PyPI upload — every real-vs-dry
  # decision keys off github.event_name (the ci-gate and release jobs are
  # push-only). There is deliberately NO dry_run input: it would be behaviorally
  # inert (both values dispatch the same non-releasing build), and `gh workflow
  # run` passing any -f key not declared here is HTTP 422. Run via
  # scripts/release_dryrun.sh (which also proves the negatives after a green run).
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which platforms to build (dispatch = dry-run; never releases)"
        type: choice
        default: linux-windows
        options:
          - linux-windows
          - all
          - linux
          - windows
          - macos

# Serialize per ref so a tag delete/re-push can't race two release runs onto the
# same uploads. Never cancel an in-flight release (publishes a GitHub Release).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Emit the build matrix from the committed single source of truth
  # (.github/release-matrix.json), filtered by the workflow_dispatch `platforms`
  # input. On a real tag push (and on dispatch platforms=all) ALL four entries
  # are emitted unchanged, so real releases stay byte-identical to the legacy
  # static matrix. Keeping the matrix in ONE committed file (not a second inline
  # copy) is what removes divergence risk. The per-OS rationale that used to live
  # on the static matrix now sits above the build job below.
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build matrix from platforms selection
        id: filter
        shell: bash
        env:
          # push (real release) always builds everything; dispatch honors the
          # input. On push, inputs.platforms is empty, so the ternary yields 'all'.
          PLATFORMS: ${{ github.event_name == 'push' && 'all' || inputs.platforms }}
        run: |
          set -euo pipefail
          case "$PLATFORMS" in
            all)           SEL='["linux","windows","macos-arm64","macos-intel"]' ;;
            linux)         SEL='["linux"]' ;;
            windows)       SEL='["windows"]' ;;
            macos)         SEL='["macos-arm64","macos-intel"]' ;;
            linux-windows) SEL='["linux","windows"]' ;;
            *) echo "::error::Unknown platforms selection: $PLATFORMS"; exit 1 ;;
          esac
          echo "Selection: $PLATFORMS -> $SEL"
          # Filter the source-of-truth entries to the selected platforms, strip the
          # internal `platform` key, and wrap as {"include":[...]} (the shape
          # fromJSON feeds strategy.matrix). Emitted entries are field-identical to
          # the legacy static include.
          MATRIX=$(jq -c --argjson sel "$SEL" \
            '{include: [ .[] | select([.platform] | inside($sel)) | del(.platform) ]}' \
            .github/release-matrix.json)
          # Fail LOUDLY at setup on an empty/malformed filter result rather than as
          # a confusing downstream fromJSON matrix-expansion error.
          echo "$MATRIX" | jq -e '.include | length > 0' > /dev/null \
            || { echo "::error::Empty matrix for selection '$PLATFORMS'"; exit 1; }
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "$MATRIX" | jq .

  # A v* tag does not trigger ci.yml (push/PR-to-main only). Require a green CI
  # run on the exact tagged commit before building/publishing release artifacts.
  # Mirrored in publish.yml.
  ci-gate:
    # push-only: a workflow_dispatch is a dry-run with no tagged commit to gate on,
    # so this job is SKIPPED on dispatch and the build job reads
    # needs.ci-gate.result == 'skipped'. This job-level guard is what makes that
    # result deterministic ('skipped' on dispatch, 'success'/'failure' on a tag).
    # It INTENTIONALLY diverges from publish.yml's byte-identical "Mirrored in
    # publish.yml" ci-gate — publish.yml has no workflow_dispatch trigger, so it
    # needs no guard. Do NOT "fix the drift" by removing this: it would make a
    # dry-run wait 30 min on CI that will never run for a branch dispatch.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Require green CI on the tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Wait for ci.yml on this SHA and require a "success" conclusion. The
          # tag is often pushed together with the commit, so the CI run may be
          # queued, in progress, or not yet registered when this gate starts
          # (v2.6.2 failed exactly that race). Still fail closed: no CI run
          # within the grace window, or CI finishing without success, fails.
          GRACE=300      # seconds for a CI run to appear at all
          DEADLINE=1800  # seconds total for CI to finish
          while :; do
            RUNS=$(gh api --paginate \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}" \
              --jq '[.workflow_runs[] | {status, conclusion}]')
            SUCCESS=$(echo "$RUNS" | jq '[.[] | select(.conclusion == "success")] | length')
            PENDING=$(echo "$RUNS" | jq '[.[] | select(.status != "completed")] | length')
            TOTAL=$(echo "$RUNS" | jq 'length')
            if [ "$SUCCESS" -gt 0 ]; then
              echo "Green CI run found for tagged commit."
              break
            fi
            if [ "$TOTAL" -gt 0 ] && [ "$PENDING" -eq 0 ]; then
              echo "::error::CI completed without success for ${GITHUB_SHA}. Fix CI, then re-tag."
              exit 1
            fi
            if [ "$TOTAL" -eq 0 ] && [ "$SECONDS" -ge "$GRACE" ]; then
              echo "::error::No ci.yml run appeared for ${GITHUB_SHA} within ${GRACE}s. Tag a commit pushed to main."
              exit 1
            fi
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "::error::Timed out waiting for CI on ${GITHUB_SHA}."
              exit 1
            fi
            echo "CI not complete yet (runs: ${TOTAL}, pending: ${PENDING}); retrying in 30s..."
            sleep 30
          done

  # The matrix VALUES live in .github/release-matrix.json (emitted+filtered by the
  # setup job). Per-OS rationale for those values:
  #   install_target / skip_asr_smoke drive the per-OS ASR handling. Every
  #   platform bundles local Whisper ASR via the [asr] extra EXCEPT Intel macOS:
  #   faster-whisper hard-requires onnxruntime, and onnxruntime dropped all macOS
  #   x86_64 wheels at 1.20 (the last Intel-mac builds need numpy<2, but the lock
  #   pins numpy 2.x), so [asr] is unresolvable there. The Intel build installs the
  #   base package only (skip_asr_smoke then skips the asr smoke, which would fail
  #   with no faster-whisper); the app degrades gracefully (ASR probes via
  #   find_spec → unavailable). This onnxruntime Intel-mac gap is a DESIGN
  #   exclusion the dry-run gate cannot re-catch.
  #   build_vulkan drives the from-source Vulkan pywhispercpp wheel build and its
  #   loadability smoke. "1" only on Linux + Windows: macOS stays on the CT2/Metal
  #   path (no official Vulkan artifact for macOS, and no value in MoltenVK here),
  #   so the Vulkan steps are skipped and the whispercpp smoke is skipped via
  #   skip_whispercpp_smoke: "1" on both macOS variants.
  #   Intel x86_64 macOS uses macos-15-intel: macos-13 was retired by GitHub
  #   (2025-12-04) and a retired label never gets a runner (queues forever);
  #   macos-15-intel is GitHub's recommended standard Intel replacement (free on
  #   public repos, served through ~Aug 2027 — the last x86_64 Actions image).
  #   It also drops libsvtav1 (evermeet.cx x86_64 ffmpeg ships no SVT-AV1 encoder),
  #   so animated AVIF screenshots degrade to WebP/static (probed + graceful).
  build:
    needs: [setup, ci-gate]
    # !cancelled() (not always()) so an explicit user-cancel still halts the
    # 10x-billed mac legs. The explicit needs.setup.result == 'success' guard is
    # load-bearing: !cancelled() also overrides GHA's implicit skip-on-failed-need
    # for EVERY need, so without it a setup-job failure (e.g. a jq typo) would feed
    # fromJSON('') and detonate confusingly ON A REAL TAG. ci-gate is 'skipped' on
    # dispatch and must be 'success' on a tag — the three result strings 'success'
    # / 'failure' / 'skipped' are exactly what this ternary depends on.
    if: ${{ !cancelled() && needs.setup.result == 'success' && (needs.ci-gate.result == 'success' || needs.ci-gate.result == 'skipped') }}
    strategy:
      # fail-fast is a literal sibling of matrix under strategy; it cannot be
      # injected through the fromJSON payload.
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-xinerama0 libxkbcommon-x11-0 libegl1

      - name: Install dependencies
        run: |
          # matrix.install_target is ".[asr]" everywhere except Intel macOS,
          # where it is "." (no [asr] — onnxruntime has no x86_64-mac wheel; see
          # the matrix note). The [asr] extra lands faster-whisper + ctranslate2
          # in the PyInstaller tree for Windows, macOS-arm64, and the AppImage
          # (Linux). requirements.lock pins transitive deps to known-good
          # versions. Version-constraint form (no --require-hashes): cross-
          # platform safe because an incomplete lock never fails the build on
          # unlisted packages, and a constraint never force-installs a package
          # the target doesn't require (so "." won't pull onnxruntime on Intel).
          # NOTE: the .deb package is system-managed; it does NOT bundle
          # faster-whisper (users install the [asr] extra separately if desired).
          pip install "${{ matrix.install_target }}" -c requirements.lock

      # PyInstaller bootloader handling. The prebuilt PyPI wheel ships a bootloader
      # binary whose hash AV vendors flag (malware reuses it), a major source of the
      # Defender false positives. On Windows, build it from source (--no-binary) so
      # the bootloader gets a fresh, unflagged hash; windows-latest has the MSVC
      # toolchain preinstalled. Other OSes keep the prebuilt wheel. Pin for
      # reproducible bundles; bump deliberately.
      - name: Install PyInstaller (Windows, bootloader from source)
        if: runner.os == 'Windows'
        run: pip install --no-binary pyinstaller pyinstaller==6.20.0

      - name: Install PyInstaller (Linux/macOS)
        if: runner.os != 'Windows'
        run: pip install pyinstaller==6.20.0

      - name: Extract and validate version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Single source of truth: anki_miner/__init__.py (Issue #10). pyproject
          # reads from it via [tool.setuptools.dynamic]. Parse the literal
          # directly so this step doesn't depend on the package being installed.
          CODE_VERSION=$(python -c "import re; print(re.search(r'__version__\s*=\s*[\"\x27]([^\"\x27]+)[\"\x27]', open('anki_miner/__init__.py').read()).group(1))")
          echo "Code version: $CODE_VERSION"
          if [ "$EVENT_NAME" = "push" ]; then
            # Real release: the git tag MUST equal the code version (Issue #10).
            TAG_VERSION=${GITHUB_REF_NAME#v}
            echo "Tag version: $TAG_VERSION"
            if [ "$TAG_VERSION" != "$CODE_VERSION" ]; then
              echo "::error::Version mismatch: git tag v$TAG_VERSION != anki_miner/__init__.py $CODE_VERSION"
              exit 1
            fi
          else
            # Dry-run dispatch: GITHUB_REF_NAME is a branch, not a v* tag. Drive the
            # artifact filenames (Inno/AppImage/.deb + the upload globs) off the code
            # version, but assert it is sane semver so a malformed __version__ fails
            # the dry-run loudly instead of producing garbage-named artifacts.
            if ! echo "$CODE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
              echo "::error::anki_miner/__init__.py __version__ is not semver: '$CODE_VERSION'"
              exit 1
            fi
          fi
          # Always emit the code version: on push it equals the tag (asserted
          # above); on dispatch there is no tag to derive from.
          echo "version=$CODE_VERSION" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------------
      # Fetch a full static GPL ffmpeg build per-OS and flatten ffmpeg/ffprobe
      # into vendor/ffmpeg/ at the repo root BEFORE PyInstaller runs. The spec
      # (anki_miner.spec) globs vendor/ffmpeg/ and bundles whatever it finds at
      # sys._MEIPASS/bin/ — the runtime resolver's lookup path. URLs are pinned
      # to immutable assets and every download is SHA256-verified for
      # reproducibility/supply-chain safety. These are GPL builds (NOT minimal):
      # they ship libmp3lame, libopus, libsvtav1, and libwebp/libwebp_anim,
      # which the bundled smoke step below asserts.
      # ---------------------------------------------------------------------
      - name: Fetch static ffmpeg (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # BtbN/FFmpeg-Builds. Pin a MONTHLY snapshot tag, never a daily one:
          # BtbN prunes daily autobuilds after ~10 days (404), but keeps the
          # last-of-month snapshot long-term (15+ months of history live).
          URL="https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-05-31-13-22/ffmpeg-n8.1.1-9-g58d4114d36-linux64-gpl-8.1.tar.xz"
          SHA256="0d14781b885c491f5c3b799cbe7d3a26ba8a7eb01935483185e31ea7d79c8cd3"
          curl -fL "$URL" -o ffmpeg-dl.tar.xz
          echo "${SHA256}  ffmpeg-dl.tar.xz" | sha256sum -c -
          mkdir -p vendor/ffmpeg extracted
          tar -xf ffmpeg-dl.tar.xz -C extracted
          cp "$(find extracted -type f -path '*/bin/ffmpeg' | head -1)" vendor/ffmpeg/ffmpeg
          cp "$(find extracted -type f -path '*/bin/ffprobe' | head -1)" vendor/ffmpeg/ffprobe
          chmod +x vendor/ffmpeg/ffmpeg vendor/ffmpeg/ffprobe
          rm -rf extracted ffmpeg-dl.tar.xz
          echo "Bundled ffmpeg landed in vendor/ffmpeg/:"
          ls -la vendor/ffmpeg/

      - name: Fetch static ffmpeg (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # Two arch-native static ffmpeg/ffprobe sources, selected by runner.arch:
          #
          #   ARM64 (macos-latest) -> osxexperts.net arm64 builds. NOT version-pinned
          #     (ffmpeg81arm.zip is overwritten when a new ffmpeg minor ships), so the
          #     hard-coded SHA256 will hard-fail this step the day osxexperts updates
          #     the asset. That is intentional fail-closed behavior.
          #
          #   X64 (macos-15-intel) -> evermeet.cx Intel builds. These URLs ARE version-pinned
          #     (ffmpeg-8.1.2.zip is immutable; new versions get new filenames), so the
          #     hash only changes when we deliberately bump the version.
          #
          # In both cases ffmpeg/ffprobe are SEPARATE downloads, each a zip with a
          # single top-level binary. A checksum mismatch must block the release until a
          # maintainer re-pins the hash. Do not relax to soft-verify.
          if [ "${RUNNER_ARCH}" = "ARM64" ]; then
            FFMPEG_URL="https://www.osxexperts.net/ffmpeg81arm.zip"
            FFMPEG_SHA256="ebb82529562b71170807bbc6b0e7eb4f0b13af8cbb0e085bb9e8f6fe709598ad"
            FFPROBE_URL="https://www.osxexperts.net/ffprobe81arm.zip"
            FFPROBE_SHA256="a6640a77d38a6f0527c5b597e599cb36a3427a6931444ed80bc62542421950a1"
          else
            FFMPEG_URL="https://evermeet.cx/ffmpeg/ffmpeg-8.1.2.zip"
            FFMPEG_SHA256="e91df72a1ee7c26606f90dd2dd4dcccc6a75140ff9ea6fdd50faae828b82ba69"
            FFPROBE_URL="https://evermeet.cx/ffmpeg/ffprobe-8.1.2.zip"
            FFPROBE_SHA256="399b93f0b9862f69767afa343e90c2f48d7e7958cadbb6deb76a012d0e3b7ce3"
          fi
          mkdir -p vendor/ffmpeg
          curl -fL "$FFMPEG_URL" -o ffmpeg.zip
          curl -fL "$FFPROBE_URL" -o ffprobe.zip
          echo "${FFMPEG_SHA256}  ffmpeg.zip" | shasum -a 256 -c -
          echo "${FFPROBE_SHA256}  ffprobe.zip" | shasum -a 256 -c -
          unzip -oj ffmpeg.zip ffmpeg -d vendor/ffmpeg
          unzip -oj ffprobe.zip ffprobe -d vendor/ffmpeg
          chmod +x vendor/ffmpeg/ffmpeg vendor/ffmpeg/ffprobe
          rm -f ffmpeg.zip ffprobe.zip
          echo "Bundled ffmpeg landed in vendor/ffmpeg/:"
          ls -la vendor/ffmpeg/

      - name: Fetch static ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # BtbN/FFmpeg-Builds. Pin a MONTHLY snapshot tag, never a daily one:
          # BtbN prunes daily autobuilds after ~10 days (404), but keeps the
          # last-of-month snapshot long-term (15+ months of history live).
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-05-31-13-22/ffmpeg-n8.1.1-9-g58d4114d36-win64-gpl-8.1.zip"
          $sha256 = "7fe1bb1e76edf97b8ec9e84fb32b96d125d846135b6b9218af772f5af2bd9065"
          curl.exe -fL $url -o ffmpeg-dl.zip
          $actual = (Get-FileHash ffmpeg-dl.zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $sha256) {
            Write-Error "SHA256 mismatch for ffmpeg-dl.zip: expected $sha256 got $actual"
            exit 1
          }
          New-Item -ItemType Directory -Force -Path vendor\ffmpeg | Out-Null
          Expand-Archive -Path ffmpeg-dl.zip -DestinationPath extracted -Force
          $ff = Get-ChildItem -Path extracted -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $fp = Get-ChildItem -Path extracted -Recurse -Filter ffprobe.exe | Select-Object -First 1
          Copy-Item $ff.FullName vendor\ffmpeg\ffmpeg.exe -Force
          Copy-Item $fp.FullName vendor\ffmpeg\ffprobe.exe -Force
          Remove-Item -Recurse -Force extracted, ffmpeg-dl.zip
          Write-Host "Bundled ffmpeg landed in vendor/ffmpeg/:"
          Get-ChildItem vendor\ffmpeg

      # ---------------------------------------------------------------------
      # Fetch the alass subtitle-retiming binary per-OS and place it in
      # vendor/alass/ BEFORE PyInstaller runs. The spec (anki_miner.spec)
      # picks up whatever lands in vendor/alass/ and bundles it at
      # sys._MEIPASS/bin/ — the path alass_resolver.py checks first when
      # running frozen. macOS has no upstream v2.0.0 binary; the resolver
      # falls back to PATH (brew install alass). URLs are pinned to
      # immutable v2.0.0 release assets and every download is SHA256-
      # verified for reproducibility/supply-chain safety. alass is GPL-3.0.
      # ---------------------------------------------------------------------
      - name: Fetch alass binary (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # kaegi/alass v2.0.0 static linux64 binary. Pinned to an immutable
          # release asset; SHA256 verified fail-closed.
          URL="https://github.com/kaegi/alass/releases/download/v2.0.0/alass-linux64"
          SHA256="7bd0b9ae7e035d3ba940eacffb21243614df36231d47f21f0b4ce42001ab7fcd"
          curl -fL "$URL" -o alass-dl
          echo "${SHA256}  alass-dl" | sha256sum -c -
          mkdir -p vendor/alass
          cp alass-dl vendor/alass/alass
          chmod +x vendor/alass/alass
          rm -f alass-dl
          mkdir -p licenses/alass
          curl -fL "https://raw.githubusercontent.com/kaegi/alass/v2.0.0/LICENSE" \
            -o licenses/alass/LICENSE
          echo "Bundled alass landed in vendor/alass/:"
          ls -la vendor/alass/

      - name: Fetch alass binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # kaegi/alass v2.0.0 windows64 zip. Pinned to an immutable release
          # asset; SHA256 verified fail-closed. The zip member is
          # alass-windows64/bin/alass-cli.exe; renamed to alass.exe to match
          # the sys._MEIPASS/bin/alass.exe path alass_resolver.py expects.
          $url = "https://github.com/kaegi/alass/releases/download/v2.0.0/alass-windows64.zip"
          $sha256 = "e81a72f97f592910e909a2352d6b8c0de0801c51ac1383bad4ebf3f2ecdd2fd8"
          curl.exe -fL $url -o alass-dl.zip
          $actual = (Get-FileHash alass-dl.zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $sha256) {
            Write-Error "SHA256 mismatch for alass-dl.zip: expected $sha256 got $actual"
            exit 1
          }
          New-Item -ItemType Directory -Force -Path vendor\alass | Out-Null
          Expand-Archive -Path alass-dl.zip -DestinationPath alass-extracted -Force
          $exe = Get-ChildItem -Path alass-extracted -Recurse -Filter "alass-cli.exe" | Select-Object -First 1
          Copy-Item $exe.FullName vendor\alass\alass.exe -Force
          New-Item -ItemType Directory -Force -Path licenses\alass | Out-Null
          curl.exe -fL "https://raw.githubusercontent.com/kaegi/alass/v2.0.0/LICENSE" `
            -o licenses\alass\LICENSE
          Remove-Item -Recurse -Force alass-extracted, alass-dl.zip
          Write-Host "Bundled alass landed in vendor/alass/:"
          Get-ChildItem vendor\alass

      # =====================================================================
      # Vulkan-enabled pywhispercpp — BUILD FROM SOURCE, per-OS (Linux + Windows
      # only; macOS stays CT2/Metal). No prebuilt Vulkan artifact exists on any
      # OS, so we self-build. ADDITIVE: a failure here is loud (fail-closed, no
      # `continue-on-error`) and does NOT touch the ffmpeg/alass/CT2 artifacts —
      # it only adds the Vulkan ggml backend on top of the [asr] install.
      #
      # All pins live in constraints/asr-vulkan-build.txt (pywhispercpp ref,
      # whisper.cpp submodule SHA carried by that ref, Vulkan SDK version, and the
      # auditwheel/delvewheel repair tools). Shaders compile to SPIR-V at BUILD
      # time via glslc — NO GPU is needed on the runner.
      # =====================================================================

      # Vulkan SDK / glslc supplies the headers + shader compiler at build time.
      - name: Install Vulkan SDK (Linux)
        if: runner.os == 'Linux' && matrix.build_vulkan == '1'
        # LunarG Vulkan SDK via jakoch/install-vulkan-sdk-action — SAME action and
        # pins as the Windows step below. The SDK bundles the Vulkan headers, glslc
        # (shaderc), SPIR-V tools and libvulkan.so, and the action sets VULKAN_SDK
        # + puts glslc on PATH so CMake's find_package(Vulkan) succeeds; the loader
        # is EXCLUDED from the wheel below so the user's GPU-driver loader wins at
        # runtime. No GPU/driver needed to build. NOTE: apt cannot supply glslc on
        # the pinned ubuntu-22.04 runner — shaderc is only packaged from 24.04, so
        # `apt-get install glslc` fails with "Unable to locate package glslc".
        uses: jakoch/install-vulkan-sdk-action@37effcfa045411f8bfbbda26df2fd1b3bf3436fa # v1.6.0
        with:
          vulkan_version: "1.4.350.0"
          install_runtime: false
          cache: true

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows' && matrix.build_vulkan == '1'
        # LunarG Vulkan SDK via jakoch/install-vulkan-sdk-action. Pinned to an
        # immutable commit SHA (matches the SHA-pinned third-party actions in this
        # workflow) AND a Vulkan SDK version (constraints/asr-vulkan-build.txt).
        # The action sets VULKAN_SDK and puts glslc on PATH for the build step.
        uses: jakoch/install-vulkan-sdk-action@37effcfa045411f8bfbbda26df2fd1b3bf3436fa # v1.6.0
        with:
          vulkan_version: "1.4.350.0"
          install_runtime: false
          cache: true

      # Build the wheel from the pinned pywhispercpp ref with the Vulkan backend,
      # then repair it EXCLUDING the Vulkan loader. We pass NO_REPAIR=1 so
      # pywhispercpp's own repairwheel step does NOT run — its repairwheel call
      # vendors every external dep with no way to exclude the loader. We then run
      # the real repair tool ourselves, which DOES support --exclude.
      - name: Build Vulkan pywhispercpp wheel (Linux)
        if: runner.os == 'Linux' && matrix.build_vulkan == '1'
        env:
          # setup.py forwards every env var as a CMake -D, so these become
          # -DGGML_VULKAN=1 -DGGML_BACKEND_DL=1 on the whisper.cpp/ggml configure.
          GGML_VULKAN: "1"
          GGML_BACKEND_DL: "1"
          NO_REPAIR: "1"
        run: |
          set -euo pipefail
          # auditwheel does the wheel repair + loader exclusion (pinned).
          pip install -c constraints/asr-vulkan-build.txt auditwheel
          mkdir -p dist-vulkan-raw dist-vulkan
          # git+ (not the PyPI sdist) so the whisper.cpp/pybind11 submodules are
          # fetched at the SHAs the pinned tag records. --no-build-isolation would
          # drop the build deps pywhispercpp declares, so keep isolation ON.
          pip wheel --no-deps -w dist-vulkan-raw \
            "pywhispercpp @ git+https://github.com/absadiki/pywhispercpp.git@v1.5.0"
          RAW=$(find dist-vulkan-raw -name 'pywhispercpp-*.whl' | head -1)
          echo "Raw (unrepaired) wheel: $RAW"
          # Repair: graft the ggml/whisper libs INTO the wheel but EXCLUDE the
          # Vulkan loader so ggml-vulkan binds the system/driver loader at runtime.
          auditwheel repair --exclude libvulkan.so.1 --exclude libvulkan.so \
            -w dist-vulkan "$RAW"
          WHEEL=$(find dist-vulkan -name 'pywhispercpp-*.whl' | head -1)
          echo "VULKAN_WHEEL=$WHEEL" >> "$GITHUB_ENV"
          echo "Repaired Vulkan wheel: $WHEEL"
          # Loud, fail-closed sanity: the loader must NOT be inside the wheel, and
          # the ggml-vulkan backend MUST be.
          unzip -l "$WHEEL" | tee wheel_contents.txt
          if grep -Eiq 'libvulkan\.so' wheel_contents.txt; then
            echo "::error::Vulkan loader leaked into the wheel — exclude failed"
            exit 1
          fi
          if ! grep -Eiq 'libggml-vulkan' wheel_contents.txt; then
            echo "::error::ggml-vulkan backend missing from the wheel — Vulkan build did not produce the backend"
            exit 1
          fi

      - name: Build Vulkan pywhispercpp wheel (Windows)
        if: runner.os == 'Windows' && matrix.build_vulkan == '1'
        shell: pwsh
        env:
          GGML_VULKAN: "1"
          GGML_BACKEND_DL: "1"
          NO_REPAIR: "1"
        run: |
          $ErrorActionPreference = "Stop"
          # delvewheel does the wheel repair + loader exclusion (pinned).
          pip install -c constraints/asr-vulkan-build.txt delvewheel
          New-Item -ItemType Directory -Force -Path dist-vulkan-raw, dist-vulkan | Out-Null
          # git+ so the whisper.cpp/pybind11 submodules are fetched at the pinned SHAs.
          pip wheel --no-deps -w dist-vulkan-raw `
            "pywhispercpp @ git+https://github.com/absadiki/pywhispercpp.git@v1.5.0"
          $raw = Get-ChildItem dist-vulkan-raw -Filter 'pywhispercpp-*.whl' | Select-Object -First 1
          Write-Host "Raw (unrepaired) wheel: $($raw.FullName)"
          # Repair: graft ggml/whisper DLLs into the wheel but EXCLUDE the Vulkan
          # loader (vulkan-1.dll) so ggml-vulkan binds the system loader at runtime.
          delvewheel repair --exclude vulkan-1.dll --add-path "$env:VULKAN_SDK\Bin" `
            -w dist-vulkan $raw.FullName
          $wheel = Get-ChildItem dist-vulkan -Filter 'pywhispercpp-*.whl' | Select-Object -First 1
          "VULKAN_WHEEL=$($wheel.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Repaired Vulkan wheel: $($wheel.FullName)"
          # Loud, fail-closed sanity: the loader must NOT be inside the wheel, and
          # the ggml-vulkan backend MUST be.
          python -c "import zipfile,sys; n=zipfile.ZipFile(sys.argv[1]).namelist(); print('\n'.join(n))" $wheel.FullName | Tee-Object wheel_contents.txt
          if (Select-String -Path wheel_contents.txt -Pattern 'vulkan-1\.dll' -Quiet) {
            Write-Error "Vulkan loader leaked into the wheel — exclude failed"; exit 1
          }
          if (-not (Select-String -Path wheel_contents.txt -Pattern 'ggml-vulkan' -Quiet)) {
            Write-Error "ggml-vulkan backend missing from the wheel — Vulkan build did not produce the backend"; exit 1
          }

      # Install the built Vulkan wheel into the SAME env PyInstaller bundles from,
      # BEFORE PyInstaller runs, replacing any CPU pywhispercpp. --force-reinstall
      # so a pywhispercpp pulled in by [asr] (now or in future) is overwritten by
      # the Vulkan build. Record the wheel's sha256 as a release artifact for
      # provenance. shell: bash on both OSes (windows-latest has bash + sha256sum).
      - name: Install Vulkan wheel into bundle env + record sha256
        if: matrix.build_vulkan == '1'
        shell: bash
        run: |
          set -euo pipefail
          echo "Installing Vulkan pywhispercpp wheel: ${VULKAN_WHEEL}"
          pip install --force-reinstall --no-deps "${VULKAN_WHEEL}"
          # --no-deps above (so the faster-whisper/ctranslate2 pins from [asr] are
          # NOT disturbed) means pywhispercpp's own runtime deps are not installed.
          # pywhispercpp.model imports pywhispercpp.constants (-> platformdirs) and
          # pywhispercpp.utils (-> requests, tqdm) at module load, so without these
          # the frozen bundle would raise ModuleNotFoundError on the first
          # `import pywhispercpp.model` and the Vulkan engine would silently never
          # activate. Install them (pure-Python, tiny) so PyInstaller collects them.
          # Adding them to the [asr-vulkan] extra is NOT enough — the release job
          # installs [asr], not [asr-vulkan].
          pip install platformdirs requests tqdm
          # Provenance artifact: the built wheel's sha256, next to the bundle.
          mkdir -p dist
          # Strip BOTH path separators: $VULKAN_WHEEL is a backslash path on
          # Windows (PowerShell wrote it) and POSIX basename treats `\` literally.
          WHEEL_BASENAME="${VULKAN_WHEEL##*[\\/]}"
          sha256sum "${VULKAN_WHEEL}" | awk -v n="${WHEEL_BASENAME}" '{print $1"  "n}' \
            > "dist/${{ matrix.artifact_name }}-pywhispercpp-vulkan.sha256"
          echo "Recorded sha256:"
          cat "dist/${{ matrix.artifact_name }}-pywhispercpp-vulkan.sha256"

      - name: Build with PyInstaller
        run: pyinstaller anki_miner.spec

      # Bundle-validation smokes, all three in one shared script so the local
      # preflight (scripts/release_preflight.sh) and CI assert identically and
      # cannot drift. The script runs, fail-closed:
      #   - youtube : yt-dlp extractor registry survived collect_all (no network)
      #   - asr     : faster-whisper + ctranslate2 + av native libs resolve, no
      #               model download (HF_HUB_OFFLINE=1 set inside the script). A
      #               model download in CI is never acceptable (150 MB+, runtime-
      #               provided). This is the smoke that caught the v2.7.1 av miss.
      #               SKIPPED on Intel macOS (BUNDLE_SMOKE_SKIP_ASR=1) — that
      #               build ships no [asr] extra, so the smoke would fail.
      #   - ffmpeg  : bundled ffmpeg ships libmp3lame/libopus/libsvtav1/libwebp/
      #               libwebp_anim (anim asserted separately so a still-only webp
      #               build can't pass while animated screenshots fail at runtime).
      #   - whispercpp-vulkan : IMPORT/LOADABILITY ONLY — the from-source Vulkan
      #               pywhispercpp wheel was bundled (ggml-vulkan backend lib
      #               present), the frozen binary's hidden Vulkan probe prints an
      #               integer device count (0 expected on GPU-less runners), AND
      #               the frozen binary actually `import pywhispercpp.model`s (the
      #               real runtime chain that pulls platformdirs/requests/tqdm — so
      #               a missing transitive dep fails the gate). It proves NOTHING
      #               about GPU transcription. SKIPPED on macOS
      #               (skip_whispercpp_smoke: "1" on both macOS variants) —
      #               macOS stays on CT2/Metal and ships no Vulkan wheel.
      # shell: bash on every OS — windows-latest has bash on PATH; the script
      # finds AnkiMiner(.exe) and ffmpeg(.exe) itself.
      - name: Bundled smokes (youtube + asr + ffmpeg encoders + whispercpp-vulkan)
        shell: bash
        env:
          BUNDLE_SMOKE_SKIP_ASR: ${{ matrix.skip_asr_smoke }}
          BUNDLE_SMOKE_FFMPEG_ENCODERS: ${{ matrix.ffmpeg_encoders }}
          BUNDLE_SMOKE_SKIP_WHISPERCPP: ${{ matrix.skip_whispercpp_smoke }}
        run: scripts/bundle_smoke.sh dist/AnkiMiner

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: iscc /DAppVersion=${{ steps.version.outputs.version }} packaging\innosetup\anki_miner.iss

      - name: Build AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x packaging/appimage/build-appimage.sh
          packaging/appimage/build-appimage.sh ${{ steps.version.outputs.version }}

      - name: Install nfpm (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # Version-pinned; add SHA256 verification (matches goreleaser's
          # official checksums.txt for v2.46.0). Fail-closed on mismatch.
          NFPM_SHA256="43b4cb72cde2d6e61c02e5b330e3276882252bf67c057e089957f9dbd2c8de42"
          wget -q https://github.com/goreleaser/nfpm/releases/download/v2.46.0/nfpm_2.46.0_Linux_x86_64.tar.gz
          echo "${NFPM_SHA256}  nfpm_2.46.0_Linux_x86_64.tar.gz" | sha256sum -c -
          tar -xzf nfpm_2.46.0_Linux_x86_64.tar.gz nfpm
          chmod +x nfpm

      - name: Build .deb package (Linux)
        if: runner.os == 'Linux'
        run: |
          # The .deb relies on system ffmpeg (licenses/ffmpeg/README.md), so it
          # must NOT ship the bundled GPL ffmpeg the PyInstaller tree carries.
          # It must also NOT ship faster-whisper/ctranslate2 — the [asr] extra is
          # installed for the whole Linux job so the AppImage onedir has the ASR
          # libs, but the .deb must stay lean (users pip-install [asr] separately).
          # Stage a copy with both ffmpeg and ASR libs stripped; the AppImage
          # (built above) keeps everything.
          rm -rf dist/deb-stage
          cp -a dist/AnkiMiner dist/deb-stage
          # Strip both onedir layouts: _internal/ (recent PyInstaller) and root.
          # ffmpeg/ffprobe binaries:
          rm -f dist/deb-stage/_internal/bin/ffmpeg dist/deb-stage/_internal/bin/ffprobe
          rm -f dist/deb-stage/bin/ffmpeg dist/deb-stage/bin/ffprobe
          # ASR native libs (ctranslate2, faster_whisper Python package dirs and
          # their shared libs; onnxruntime and av are excluded via spec but strip
          # defensively in case the layout ever changes).
          rm -rf dist/deb-stage/_internal/ctranslate2
          rm -rf dist/deb-stage/_internal/faster_whisper
          rm -rf dist/deb-stage/_internal/onnxruntime
          rm -rf dist/deb-stage/_internal/av
          rm -rf dist/deb-stage/ctranslate2
          rm -rf dist/deb-stage/faster_whisper
          rm -rf dist/deb-stage/onnxruntime
          rm -rf dist/deb-stage/av
          # Also strip the ctranslate2 shared lib itself (libctranslate2.so.*).
          find dist/deb-stage -name 'libctranslate2*.so*' -delete
          # whisper.cpp/ggml (pywhispercpp Vulkan backend) — same rationale: the
          # .deb is system-managed and stays lean; users who want local ASR
          # pip-install the extra (now [asr-vulkan]) separately. The AppImage
          # (built above) keeps these. Strip the package dir, the _pywhispercpp
          # extension, and every ggml/whisper shared lib (incl. ggml-vulkan),
          # across both onedir layouts.
          rm -rf dist/deb-stage/_internal/pywhispercpp
          rm -rf dist/deb-stage/pywhispercpp
          find dist/deb-stage -name '_pywhispercpp*.so' -delete
          find dist/deb-stage -name 'libggml*.so*' -delete
          find dist/deb-stage -name 'libwhisper*.so*' -delete
          # Fail closed: verify no bundled ffmpeg, ffprobe, ctranslate2/
          # faster_whisper, or pywhispercpp/ggml/whisper libs remain in the stage tree.
          BAD=$(find dist/deb-stage -type f \( \
            -name 'ffmpeg' -o -name 'ffprobe' -o \
            -name 'libctranslate2*.so*' -o \
            -name '_pywhispercpp*.so' -o \
            -name 'libggml*.so*' -o -name 'libwhisper*.so*' \) ; \
            find dist/deb-stage -type d \( \
            -name 'ctranslate2' -o -name 'faster_whisper' -o \
            -name 'pywhispercpp' \))
          if [ -n "$BAD" ]; then
            echo "::error::ASR/ffmpeg artifacts still present in deb stage tree:"
            echo "$BAD"
            exit 1
          fi
          VERSION=${{ steps.version.outputs.version }} ./nfpm package \
            --config packaging/nfpm.yaml \
            --packager deb \
            --target dist/anki-miner_${{ steps.version.outputs.version }}_amd64.deb

      - name: Create archive (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          tar -czf ${{ matrix.artifact_name }}.tar.gz AnkiMiner/

      # Per-OS explicit upload with if-no-files-found: error. A single catch-all
      # step with default 'warn' only fails when NOTHING matches, so a sibling
      # asset filename drift (installer/AppImage/.deb) would upload just the
      # archive and the release would publish incomplete. Listing each OS's full
      # expected asset set and erroring on any miss closes that gap.
      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: |
            dist/AnkiMiner-${{ steps.version.outputs.version }}-Linux-x86_64.AppImage
            dist/anki-miner_${{ steps.version.outputs.version }}_amd64.deb
            dist/${{ matrix.artifact_name }}-pywhispercpp-vulkan.sha256

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: dist/${{ matrix.artifact_name }}.tar.gz

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: |
            dist/AnkiMiner-${{ steps.version.outputs.version }}-Windows-x86_64-Setup.exe
            dist/${{ matrix.artifact_name }}-pywhispercpp-vulkan.sha256

  release:
    needs: build
    # push-only: a dispatch is a dry-run and must NEVER create a GitHub Release.
    # Bare event-name guard with NO always()/!cancelled() wrapper — that preserves
    # GHA's implicit `needs: build` green-gate, so a broken build leg still can't
    # publish a Release.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*-Setup.exe
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*-pywhispercpp-vulkan.sha256
