name: Android engine goldens

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      engine_revision:
        description: Full desktop engine commit to derive (defaults to Android engine.lock)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: android-engine-goldens-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_ENGINE_REVISION: ba3b3cfbcc53e57a440c8b9f157209851408c62a
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"
  SOURCE_DATE_EPOCH: "315532800"
  TZ: UTC

jobs:
  derive:
    name: Derive versioned fixture artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exporter
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: tool

      - name: Checkout clean engine source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.engine_revision || env.ANDROID_ENGINE_REVISION }}
          path: engine

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.7"
          cache: pip
          cache-dependency-path: tool/scripts/golden-runtime-requirements.txt

      - name: Install frozen golden runtime
        run: |
          python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            --requirement tool/scripts/golden-runtime-requirements.txt

      - name: Prepare pinned external UniDic data
        run: |
          python tool/scripts/prepare_golden_unidic.py \
            --destination "$RUNNER_TEMP/unidic-dicdir"

      - name: Resolve exact inputs
        id: inputs
        shell: bash
        run: |
          echo "engine_revision=$(git -C engine rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "unidic_dir=$RUNNER_TEMP/unidic-dicdir" >> "$GITHUB_OUTPUT"

      - name: Derive goldens from engine execution
        shell: bash
        run: |
          mkdir -p artifacts
          python tool/scripts/dump_engine_goldens.py \
            --schema-version 2 \
            --engine-root "$GITHUB_WORKSPACE/engine" \
            --corpus "$GITHUB_WORKSPACE/tool/tests/fixtures/goldens/tokenizer-v1.json" \
            --v2-input "$GITHUB_WORKSPACE/tool/tests/fixtures/goldens/engine-v2-input.json" \
            --dicdir "${{ steps.inputs.outputs.unidic_dir }}" \
            --compact \
            --output artifacts/engine-goldens.json

      - name: Verify artifact provenance
        env:
          EXPECTED_ENGINE_REVISION: ${{ steps.inputs.outputs.engine_revision }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          artifact = Path("artifacts/engine-goldens.json")
          payload = json.loads(artifact.read_text(encoding="utf-8"))
          provenance = payload["provenance"]

          if payload["schema_version"] != 2:
              raise SystemExit("derived artifact is not the complete v2 contract")

          def canonical(value):
              return json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode("utf-8")

          if provenance["engine"]["revision"] != os.environ["EXPECTED_ENGINE_REVISION"]:
              raise SystemExit("derived engine revision does not match the checked-out source")
          for section, key in (
              ("engine", "tree_sha256"),
              ("tool", "sha256"),
              ("runtime", "sha256"),
              ("data", "sha256"),
          ):
              value = provenance[section][key]
              if len(value) != 64 or any(character not in "0123456789abcdef" for character in value):
                  raise SystemExit(f"invalid {section} provenance hash")
          for section in ("runtime", "data"):
              unhashed = dict(provenance[section])
              recorded = unhashed.pop("sha256")
              if hashlib.sha256(canonical(unhashed)).hexdigest() != recorded:
                  raise SystemExit(f"invalid {section} aggregate provenance")
          pins = {
              line.split()[0].split("==", 1)[0].lower().replace("_", "-"): line.split()[0].split("==", 1)[1]
              for line in Path("tool/scripts/golden-runtime-requirements.txt").read_text(encoding="utf-8").splitlines()
              if line[:1].isalpha()
          }
          installed = {
              name.lower().replace("_", "-"): record["version"]
              for name, record in provenance["runtime"]["dependencies"].items()
          }
          if installed != pins:
              raise SystemExit("runtime provenance does not match the frozen workflow requirements")
          for section, status in payload["section_status"].items():
              if status != {"state": "implemented"} or not payload["cases"][section]:
                  raise SystemExit(f"v2 section is not fully implemented: {section}")
          workspace = str(Path.cwd())
          if workspace in artifact.read_text(encoding="utf-8"):
              raise SystemExit("artifact leaked its host workspace path")
          print(hashlib.sha256(artifact.read_bytes()).hexdigest())
          PY
          sha256sum artifacts/engine-goldens.json > artifacts/engine-goldens.json.sha256

      - name: Upload versioned goldens
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-engine-goldens-${{ steps.inputs.outputs.engine_revision }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
