name: Dependabot auto-merge

# Queues dependabot PRs for GitHub's native auto-merge. The merge only happens
# once the required status checks on the main ruleset pass, so CI is the gate --
# this workflow just presses the button so a green bump does not sit for days.
#
# Requires "Allow auto-merge" on the repository and at least one branch rule on
# main; auto-merge is unavailable on an unprotected branch.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Every dependabot PR is queued, majors included -- the required checks
      # decide. To carve out majors (the gh-actions group can move release.yml),
      # add: steps.metadata.outputs.update-type != 'version-update:semver-major'
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --merge "$PR_URL"
